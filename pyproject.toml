[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "duckflow"
version = "0.1.0"
description = "Comment-based data-flow extraction and Mermaid rendering"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-or-later" }
authors = [
  { name = "Gregory R. Warnes" }
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

[project.scripts]
duckflow-extract = "duckflow.cli:extract_main"
duckflow-mermaid = "duckflow.cli:mermaid_main"
duckflow-mcp = "duckflow.server:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]
mcp = ["mcp>=1.0"]

[tool.setuptools.packages.find]
include = ["duckflow*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
